<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TheNicoleT Oink Cannon</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <div class="topbar">
      <div class="title">
        <span class="title-nicole">TheNicoleT</span>
        <span class="title-oink"> Oink Cannon 🐷</span>
      </div>
      <div class="hud">
        <div class="badge" id="lastResult">Ready</div>
        <button class="btn mini" id="togglePanelBtn">Hide Customize</button>
        <button class="btn mini" id="soundBtn">Sound: On</button>
        <button class="btn launch" id="launchBtn">🚀 Launch Pig</button>
      </div>
    </div>
    <div class="main">
      <div class="panel" id="panel">
        <h2>🎨 Customize Landing Zones</h2>
        <p>Edit the label and reward for each zone. Use ⚙️ to reveal sub-amounts. Add or remove zones freely!</p>
        <div id="zonesUI"></div>
        <div class="footerhint">The pig oinks when launched, bounces on the stage, and lands in a zone based on where it settles.</div>
      </div>
      <div class="gamewrap">
        <canvas id="game"></canvas>
        <!-- Big result overlay shown on landing -->
        <div id="resultOverlay" class="result-overlay hidden">
          <div id="resultText" class="result-text"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
